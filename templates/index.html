<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odd-Even Hand Cricket</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=3) }}">
</head>

<body>
  <main class="shell">
    <header class="logo">
      <h1>Odd-Even <span>Hand Cricket</span></h1>
      <p>Two players. One room. Pick a number, don't get matched.</p>
    </header>

    <section class="card">
      <label>Your name
        <input id="playerName" maxlength="24" placeholder="e.g. Sahil" autocomplete="off">
      </label>

      <div class="two-col">
        <label>Round timer (5-60 s)
          <input id="timer" type="number" min="5" max="60" value="10">
        </label>
        <label>You are
          <select id="oddEven">
            <option value="odd">Odd</option>
            <option value="even">Even</option>
          </select>
        </label>
      </div>
      <button id="createBtn" class="btn-green btn-wide" disabled>Create room</button>
    </section>

    <section class="card">
      <h2>Have a code?</h2>
      <label>Room ID
        <input id="roomId" maxlength="6" placeholder="6 characters" autocomplete="off">
      </label>
      <button id="joinBtn" class="btn-blue btn-wide" disabled>Join room</button>
    </section>

    <p id="status" class="status">Connecting to the game server...</p>
    <p id="error" class="error"></p>
  </main>
  <script src="{{ url_for('static', filename='js/socket.io.min.js', v=3) }}"></script>
  <script>window.io || document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');</script>
  <script src="{{ url_for('static', filename='js/main.js', v=3) }}"></script>
</body>

</html>
