<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room {{ room_id }} | Odd-Eve Hand Cricket</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=4) }}">
</head>

<body data-room="{{ room_id }}">
  <main class="shell">
    <header class="topbar">
      <div class="name">ODD - EVE</div>
      <button id="leaveBtn" class="btn-small">Leave room</button>
    </header>

    <section class="card">
      <div id="connectionBanner" class="banner hidden"></div>
      <button id="retryBtn" class="btn-blue btn-small banner-retry hidden">Retry connection</button>
      <div id="phase" class="phase">Connecting...</div>
      <div id="target" class="target"></div>
      <div id="scoreboard" class="scoreboard"></div>

      <div class="timer"><span id="timerValue">--</span></div>
      <p id="instruction" class="instruction">Connecting to room...</p>
      <div id="waitDots" class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <p id="notice" class="hint"></p>

      <div id="numberGrid" class="number-grid hidden">
        <button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button>
        <button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button>
      </div>
      <p id="selectionStatus" class="hint"></p>

      <div id="inningsChoices" class="choice-row hidden">
        <button data-choice="bat" class="btn-green">Bat first</button>
        <button data-choice="bowl" class="btn-blue">Bowl first</button>
      </div>

      <div id="reveal" class="reveal"></div>
      <p id="gameError" class="error"></p>
    </section>

    <div class="codebar"><span class="codebox">CODE : {{ room_id }}</span></div>
  </main>
  <script src="{{ url_for('static', filename='js/socket.io.min.js', v=4) }}"></script>
  <script>window.io || document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');</script>
  <script src="{{ url_for('static', filename='js/game.js', v=4) }}"></script>
</body>

</html>
